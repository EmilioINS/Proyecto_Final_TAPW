<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocFlow - Registro</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="glass-panel">
            <div class="header">
                <h1>Crear Cuenta</h1>
                <p>Únete a DocFlow</p>
            </div>
            
            <div id="alert-box" class="alert"></div>

            <form id="register-form">
                <div class="form-group">
                    <input type="text" id="name" class="form-control" required placeholder="Tu Nombre">
                    <label for="name">Nombre Completo</label>
                </div>

                <div class="form-group">
                    <input type="email" id="email" class="form-control" required placeholder="tu@correo.com">
                    <label for="email">Correo Electrónico</label>
                </div>
                
                <div class="form-group">
                    <input type="password" id="password" class="form-control" required placeholder="••••••••" minlength="6">
                    <label for="password">Contraseña</label>
                </div>

                <div class="form-group">
                    <input type="password" id="confirm-password" class="form-control" required placeholder="••••••••" minlength="6">
                    <label for="confirm-password">Confirmar Contraseña</label>
                </div>
                
                <button type="submit" class="btn-primary" id="register-btn">
                    <span>Registrarse</span>
                </button>
            </form>

            <div class="footer-link">
                ¿Ya tienes cuenta? <a href="/index.html">Inicia Sesión</a>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
