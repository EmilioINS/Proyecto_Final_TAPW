<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocFlow — Registro · TecNM Campus Celaya</title>
    <meta name="description" content="Crea tu cuenta en el sistema documental del TecNM Campus Celaya.">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="glass-panel">

            <div class="header">
                <div class="tecnm-logo-wrap">
                    <div class="tecnm-logo-img-wrap">
                        <img src="/images/tecnm_logo.svg" alt="Escudo TecNM" loading="eager">
                    </div>
                    <div class="tecnm-wordmark">
                        <span class="tecnm-wordmark-line1">TecNM</span>
                        <span class="tecnm-wordmark-line2">Campus Celaya</span>
                    </div>
                </div>

                <div class="header-divider"></div>
                <h1>Crear Cuenta</h1>
                <p class="header-sub">Regístrate para acceder al sistema</p>
            </div>

            <div id="alert-box" class="alert"></div>

            <form id="register-form">
                <div class="form-group">
                    <label for="name">Nombre Completo</label>
                    <input type="text" id="name" class="form-control" required placeholder="Tu nombre completo">
                </div>
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control" required placeholder="usuario@tecnm.mx">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="form-control" required placeholder="Mínimo 6 caracteres" minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirmar Contraseña</label>
                    <input type="password" id="confirm-password" class="form-control" required placeholder="Repite tu contraseña" minlength="6">
                </div>
                <button type="submit" class="btn-primary" id="register-btn">
                    <span>Crear Cuenta</span>
                </button>
            </form>

            <div class="footer-link">
                ¿Ya tienes cuenta? <a href="/views/auth/login.html">Iniciar Sesión</a>
            </div>
        </div>
    </div>

    <script type="module" src="/js/pages/register.js"></script>
</body>
</html>
