<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocFlow — Iniciar Sesión · TecNM Campus Celaya</title>
    <meta name="description" content="Sistema de gestión documental del Tecnológico Nacional de México, Campus Celaya.">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="glass-panel">

            <div class="header">
                <!-- Logo TecNM: imagen real en contenedor circular blanco -->
                <div class="tecnm-logo-wrap">
                    <div class="tecnm-logo-img-wrap">
                        <img src="/images/tecnm_logo.svg" alt="Escudo TecNM" loading="eager">
                    </div>
                    <div class="tecnm-wordmark">
                        <span class="tecnm-wordmark-line1">TecNM</span>
                        <span class="tecnm-wordmark-line2">Campus Celaya</span>
                    </div>
                </div>

                <div class="header-divider"></div>
                <h1>Iniciar Sesión</h1>
                <p class="header-sub">Accede al sistema de gestión documental</p>
            </div>

            <div id="alert-box" class="alert"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control" required placeholder="usuario@tecnm.mx">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary" id="login-btn">
                    <span>Iniciar Sesión</span>
                </button>
            </form>

            <div class="footer-link">
                ¿No tienes cuenta? <a href="/views/auth/register.html">Crear cuenta</a>
            </div>
        </div>
    </div>

    <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
